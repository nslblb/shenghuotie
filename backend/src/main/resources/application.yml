server:
  port: 8080

spring:
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://localhost:3306/shenghuotiesql?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${ZHIPU_KEY}
      # GLM 慢响应时单请求会占线程 120s，导致 AI 线程池快速耗尽、全站不可用
      # connect-timeout 10s：建连慢即失败；read-timeout 60s：单 token 间最长等待
      client:
        connect-timeout: 10s
        read-timeout: 60s
      chat:
        completions-path: /chat/completions
        options:
          model: GLM-4.7-Flash
          max-tokens: 2048
      embedding:
        enabled: true
        base-url: ${EMBEDDING_BASE_URL:https://integrate.api.nvidia.com/v1}
        api-key: ${EMBEDDING_API_KEY:}
        completions-path: /embeddings
        options:
          model: nvidia/nv-embed-v1
          dimensions: 4096
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: knowledge_v1
        use-br-cosine-for-search: true

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 604800000
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:*}
  sms:
    # 开发环境：控制台打印验证码（不接入真实短信服务）
    # 生产环境在 application-prod.yml 中设为 false
    console-print-code: ${SMS_CONSOLE_PRINT:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '全部接口'
      paths-to-match: '/api/**'
      packages-to-scan: com.csust.backend.controller
